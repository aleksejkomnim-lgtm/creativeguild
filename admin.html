<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кабинет Магистра | Creative Guild</title>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: sans-serif; margin: 0; padding: 20px; }
        .admin-container { max-width: 1000px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #475569; }
        h1 { color: #ffd700; text-align: center; border-bottom: 1px solid #475569; padding-bottom: 15px; }
        .stats-grid { display: flex; gap: 15px; margin-bottom: 30px; }
        .stat-card { flex: 1; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; text-align: center; }
        .stat-value { font-size: 2rem; font-weight: bold; color: #38bdf8; margin-top: 5px; }
        .stat-label { color: #94a3b8; font-size: 0.85rem; }
        .section { margin-top: 20px; }
        .admin-btn { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
        .admin-btn:hover { background: #dc2626; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #334155; }
        th { color: #38bdf8; }
    </style>
</head>
<body>

<div class="admin-container">
    <h1>👁️ Кабинет Магистра</h1>
    
    <!-- Блок Статистики -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">Всего визитов</div>
            <div class="stat-value" id="total-visits">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Искателей (Профилей)</div>
            <div class="stat-value" id="total-users" style="color: #4ade80;">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Активных контрактов</div>
            <div class="stat-value" id="total-contracts">0</div>
        </div>
    </div>

    <div class="section">
        <h2 style="color: #f8fafc;">Управление контрактами</h2>
        <table>
            <thead>
                <tr>
                    <th>Название контракта</th>
                    <th>Заказчик (Telegram)</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="admin-contracts-list">
                <tr>
                    <td colspan="3" style="text-align: center; color: #94a3b8;">Загрузка контрактов из облака...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAnOK6tu3LC4NN1NA34-5ujwVnDPSjc2K8",
        authDomain: "creativeguild.firebaseapp.com",
        projectId: "creativeguild",
        storageBucket: "creativeguild.firebasestorage.app",
        messagingSenderId: "813913714015",
        appId: "1:813913714015:web:455a4675b5f0e758e59aea",
        measurementId: "G-C94DMDTOKV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadAdminData() {
        // 1. Просмотры
        try {
            const statsSnap = await getDoc(doc(db, "stats", "visits"));
            if (statsSnap.exists()) {
                document.getElementById('total-visits').innerText = statsSnap.data().count || 0;
            }
        } catch (e) {
            console.error("Ошибка загрузки визитов:", e);
        }

        // 2. Количество зарегистрированных пользователей
        try {
            const usersSnap = await getDocs(collection(db, "users"));
            document.getElementById('total-users').innerText = usersSnap.size;
        } catch (e) {
            console.error("Ошибка загрузки пользователей:", e);
        }

        // 3. Контракты
        const list = document.getElementById('admin-contracts-list');
        try {
            const querySnapshot = await getDocs(collection(db, "contracts"));
            list.innerHTML = '';
            document.getElementById('total-contracts').innerText = querySnapshot.size;

            if (querySnapshot.empty) {
                list.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #94a3b8;">Доска контрактов пуста.</td></tr>';
                return;
            }

            querySnapshot.forEach((documentSnapshot) => {
                const data = documentSnapshot.data();
                const docId = documentSnapshot.id;

                const row = `
                    <tr>
                        <td style="color: #cbd5e1;">
                            <strong style="color: #ffd700;">${data.title}</strong><br>
                            <small style="color: #64748b;">${data.description ? data.description.substring(0, 60) : ''}...</small>
                        </td>
                        <td style="color: #38bdf8;">@${data.contact}</td>
                        <td>
                            <button class="admin-btn" onclick="deleteContract('${docId}')">❌ Удалить</button>
                        </td>
                    </tr>
                `;
                list.innerHTML += row;
            });
        } catch (e) {
            console.error("Ошибка загрузки контрактов:", e);
            list.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #ef4444;">Ошибка связи с базой данных.</td></tr>';
        }
    }

    window.deleteContract = async function(docId) {
        if(confirm('Магистр, вы уверены, что хотите удалить этот контракт?')) {
            try {
                await deleteDoc(doc(db, "contracts", docId));
                alert('Контракт удален!');
                loadAdminData();
            } catch (e) {
                console.error("Ошибка удаления:", e);
            }
        }
    };

    window.onload = loadAdminData;
</script>

</body>
</html>
